spring.application.name=DE190599HotelGateway

server.port=8080

# Downstream services (routes are defined in GatewayRoutesConfig)
services.room.url=http://localhost:8081
services.reservation.url=http://localhost:8082

# Swagger UI of the gateway shows the API docs of both services (proxied through the gateway)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Room Service
springdoc.swagger-ui.urls[0].url=/room-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Reservation Service
springdoc.swagger-ui.urls[1].url=/reservation-service/v3/api-docs
