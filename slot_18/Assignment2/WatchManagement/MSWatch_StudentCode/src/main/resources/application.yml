server:
  port: 8083

spring:
  application:
    name: ms-watch
  # [TODO-2.1] DBWatch is created in SSMS (locally) or by db-init (Docker)
  # [TODO-2.2] One database per service; host, port and password come from the environment
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=DBWatch;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  # [TODO-6.1] A slow MSBrand must fail the step quickly instead of holding the Saga open
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

brand-service:
  url: ${BRAND_SERVICE_URL:http://localhost:8082}

saga:
  fault-injection:
    enabled: ${SAGA_FAULT_INJECTION:true}
  compensation:
    max-attempts: 3
    backoff-ms: 1000

# [TODO-6.17] Feign BASIC logging is written at DEBUG level by the client logger
logging:
  level:
    com.mss301.watch.client: DEBUG
