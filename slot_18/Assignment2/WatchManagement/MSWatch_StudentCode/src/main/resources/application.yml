server:
  port: 8083

spring:
  application:
    name: ms-watch
  # [TODO-2.1] DBWatch is created in SSMS (locally) or by db-init (Docker)
  # [TODO-2.2] One database per service; host, port and password come from the environment
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=DBWatch;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
