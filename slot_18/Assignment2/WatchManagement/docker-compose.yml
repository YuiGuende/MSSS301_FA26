# Usage: docker compose --env-file .env up --build -d
services:
  # [TODO-10.1] The other services wait until SQL Server really answers queries
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_HOST_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # [TODO-10.2] Creates the three databases once, then exits
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q
        "IF DB_ID('DBAccount') IS NULL CREATE DATABASE DBAccount;
        IF DB_ID('DBBrand') IS NULL CREATE DATABASE DBBrand;
        IF DB_ID('DBWatch') IS NULL CREATE DATABASE DBWatch;"

  # [TODO-10.3] Service configuration comes from the environment
  ms-account:
    build: ./MSAccount_StudentCode
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
    ports:
      - "8081:8081"
    depends_on:
      db-init:
        condition: service_completed_successfully

  ms-brand:
    build: ./MSBrand_StudentCode
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      db-init:
        condition: service_completed_successfully

  ms-watch:
    build: ./MSWatch_StudentCode
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD}
      # Inside the Compose network MSBrand is reached by its service name
      BRAND_SERVICE_URL: http://ms-brand:8082
      SAGA_FAULT_INJECTION: ${SAGA_FAULT_INJECTION:-true}
      # ReleaseDate must equal the current date as the client sees it, not the UTC date
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "8083:8083"
    depends_on:
      db-init:
        condition: service_completed_successfully
      ms-brand:
        condition: service_started

  api-gateway:
    build: ./APIGateway_StudentCode
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ACCOUNT_SERVICE_URL: http://ms-account:8081
      BRAND_SERVICE_URL: http://ms-brand:8082
      WATCH_SERVICE_URL: http://ms-watch:8083
    ports:
      - "8080:8080"
    depends_on:
      - ms-account
      - ms-brand
      - ms-watch

volumes:
  sqlserver-data:
