# Chay toan bo: MySQL + inventory-service + order-service
#   docker compose up -d --build
services:
  mysql:
    image: mysql:8.3.0
    container_name: shopping-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    volumes:
      # Tao 2 DB order_service va inventory_service o lan chay dau tien
      - ./order-service/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      # Trong mang Docker, goi MySQL qua ten service "mysql" thay vi localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory_service
    depends_on:
      mysql:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_service
      # Ghi de inventory.url -> goi Inventory qua ten service trong mang Docker
      INVENTORY_URL: http://inventory-service:8082
    depends_on:
      mysql:
        condition: service_healthy
      inventory-service:
        condition: service_started

volumes:
  mysql-data:
